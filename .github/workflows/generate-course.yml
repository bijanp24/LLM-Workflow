name: Generate Course

# Drafts a new course from seed material and opens a PR for review.
# Triggered by an applied repo's deploy (repository_dispatch) or manually.
on:
  repository_dispatch:
    types: [generate-course]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repo (owner/name), for the PR description
        required: false
        default: manual
      seed_title:
        description: Suggested course topic (optional)
        required: false
      seed_content:
        description: Seed material — notes / outline the course is built from
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-course-${{ github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble seed payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          IN_REPO: ${{ inputs.source_repo }}
          IN_TITLE: ${{ inputs.seed_title }}
          IN_CONTENT: ${{ inputs.seed_content }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$PAYLOAD" > seed-payload.json
          else
            node --input-type=module <<'EOF'
          import fs from 'node:fs';
          fs.writeFileSync('seed-payload.json', JSON.stringify({
            source_repo: process.env.IN_REPO || 'manual',
            seed_type: 'manual',
            seed_title: process.env.IN_TITLE || '',
            seed_content: process.env.IN_CONTENT || '',
          }));
          EOF
          fi

      - name: Generate course
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEED_PAYLOAD_FILE: seed-payload.json
        run: npm run generate-course

      - name: Remove seed payload
        if: always()
        run: rm -f seed-payload.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.gen.outputs.branch }}
          base: master
          title: "feat(course): ${{ steps.gen.outputs.course_title }}"
          commit-message: "feat(course): add ${{ steps.gen.outputs.course_id }}"
          labels: auto-generated, course
          delete-branch: true
          body: |
            Auto-generated course **${{ steps.gen.outputs.course_title }}** (`${{ steps.gen.outputs.course_id }}`), ${{ steps.gen.outputs.lesson_count }} lessons.

            - Source: `${{ github.event.client_payload.source_repo || inputs.source_repo }}`
            - Generated by `tools/generate-course.mjs` using Claude.

            ⚠️ **Review the lesson content and quiz answers before merging.** On merge to `master`, the Academy's content submodule is bumped automatically and Netlify rebuilds the site.
