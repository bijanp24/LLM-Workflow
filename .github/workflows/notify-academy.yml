name: Notify Academy

# When course content lands on master, tell the Academy to bump its content
# submodule so Netlify rebuilds the site with the new/updated courses.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content-updated to the Academy
        env:
          ACADEMY_DISPATCH_TOKEN: ${{ secrets.ACADEMY_DISPATCH_TOKEN }}
          ACADEMY_REPO: bijanp24/LLM-Workflow-Academy
        run: |
          if [ -z "$ACADEMY_DISPATCH_TOKEN" ]; then
            echo "::warning::ACADEMY_DISPATCH_TOKEN not set — Academy will not be notified."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $ACADEMY_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${ACADEMY_REPO}/dispatches" \
            -d "{\"event_type\":\"content-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Notified ${ACADEMY_REPO}."
